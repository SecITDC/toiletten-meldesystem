# nginx-Einstellungen für das Toiletten-Meldesystem.
# nginx ist der "Türsteher": er liefert die Seiten aus und gibt nur die API-Dateien an PHP weiter.

# Login-Bremse: höchstens 5 Login-Versuche pro Minute pro Gerät.
limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
limit_req_status 429;

# Hinter einem Tunnel auf diesem Server kommen alle Besucher von 127.0.0.1.
# Dann gilt die echte IP aus X-Forwarded-For, sonst teilen sich alle eine Login-Bremse.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header X-Forwarded-For;

server {
    listen 80 default_server;
    server_name _;

    # Nur dieser Ordner ist von außen sichtbar. config/, data/ und src/ liegen daneben.
    root /var/www/toiletten/public;
    index index.html;

    server_tokens off;            # Versionsnummer von nginx nicht verraten
    client_max_body_size 16k;     # eine Meldung ist klein, größere Anfragen ablehnen

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /api/login.php {
        limit_req zone=login burst=5 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_SOCK__;
    }

    location ~ ^/api/[a-z_]+\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_SOCK__;
    }

    # Alle anderen .php-Dateien und versteckte Dateien sperren.
    location ~ \.php$ { return 404; }
    location ~ /\.    { deny all; }
}
